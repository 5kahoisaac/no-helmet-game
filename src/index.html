<!DOCTYPE html>
<html>
<head>
  <title>No Helmet Game</title>
  <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
  <style>
    body { font-family: "Press Start 2P"; background: #212529; }
    .container { max-width: 800px; margin: 0 auto; display: flex; padding: 2rem; }
    #game-canvas { border: 4px solid #fff; }
    #root { display: flex; flex-direction: column; gap: 1rem; width: 600px; box-sizing: content-box; }
    #status { white-space: break-spaces; }
    #ui { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
  </style>
</head>
<body>
  <main class="container">
    <div id="root" class="nes-container with-title with-white is-centered">
      <p class="title">No Helmet Game</p>
      <div id="timer" class="nes-text is-warning">Time: 30s</div>
      <canvas id="game-canvas" width="600" height="600"></canvas>
      <div id="ui">
        <p id="status" class="nes-text is-primary">Press WASD to start! Find the helmet in 30 seconds!</p>
        <button id="retry-btn" class="nes-btn is-success" style="opacity: 0; pointer-events: none;">Try Again</button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
