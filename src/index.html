<!DOCTYPE html>
<html>
<head>
    <title>No Helmet Game</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪖</text></svg>">
    <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
    <style>
        body {
            font-family: "Press Start 2P";
            background: #212529;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            padding: 2rem;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        #game-canvas {
            border: 4px solid #fff;
        }

        #root {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 600px;
            box-sizing: content-box;
        }

        #status {
            white-space: break-spaces;
        }

        #ui {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }
    </style>
</head>
<body>
<main class="container">
    <div id="root" class="nes-container with-title with-white is-centered">
        <p class="title">No Helmet Game</p>
        <p class="nes-balloon ">
            Thanks for playing my game — more details on
            <a href="https://github.com/5kahoisaac/no-helmet-game" target="_blank">
                <span class="is-dark"><i class="nes-icon github"></i></span>
                <span class="is-primary">GitHub</span>
            </a>.
        </p>
        <div id="timer" class="nes-text is-warning">Time: 30s</div>
        <canvas id="game-canvas" width="600" height="600"></canvas>
        <div id="ui">
            <p id="status" class="nes-text is-primary">Press WASD to start! Find the helmet in 30 seconds!</p>
            <button id="retry-btn" class="nes-btn is-success" style="display: none;">Try Again</button>
        </div>
    </div>
</main>
<script src="game.js"></script>
</body>
</html>
