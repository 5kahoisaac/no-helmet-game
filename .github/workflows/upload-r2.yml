name: Upload to Cloudflare R2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.R2_API_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.R2_SECRET }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT || vars.R2_API_URL || secrets.R2_ENDPOINT || secrets.R2_API_URL }}
      R2_BUCKET: ${{ vars.R2_BUCKET || secrets.R2_BUCKET }}
      R2_PREFIX: ${{ vars.R2_PREFIX || vars.R2_FOLDER || secrets.R2_PREFIX || secrets.R2_FOLDER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload files to R2
        run: |
          test -n "$R2_ENDPOINT" || { echo "Missing R2 endpoint: set R2_ENDPOINT or R2_API_URL in the production environment."; exit 1; }
          test -n "$R2_BUCKET" || { echo "Missing R2 bucket: set R2_BUCKET in the production environment."; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing R2 access key: set R2_ACCESS_KEY_ID or R2_API_KEY in the production environment."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing R2 secret: set R2_SECRET_ACCESS_KEY or R2_SECRET in the production environment."; exit 1; }

          destination="s3://${R2_BUCKET}"
          if [ -n "$R2_PREFIX" ]; then
            destination="${destination}/${R2_PREFIX}"
          fi

          aws s3 cp index.html "${destination}/index.html" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp game.js "${destination}/game.js" \
            --endpoint-url "$R2_ENDPOINT"
